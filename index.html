
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anya's BFF Quiz 💗</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffe0ef,#f4dfff);min-height:100vh;display:grid;place-items:center;margin:0;padding:16px;box-sizing:border-box;color:#743451}
.card{background:white;padding:26px 20px;border-radius:24px;text-align:center;max-width:400px;width:100%;box-sizing:border-box;box-shadow:0 8px 28px #d98ab055}
h1{color:#e34d91}
button{background:#ed69a5;color:white;border:0;padding:13px 16px;border-radius:12px;font-size:16px;margin:6px;cursor:pointer}
#options{display:flex;flex-direction:column;align-items:stretch}
#options button{background:#fff0f7;color:#9c3569;border:1px solid #f3a3c8}
#message{min-height:24px}
</style>
</head>
<body>
<main class="card">
<div style="font-size:42px">🎀💗🧸</div>
<h1>Anya's BFF Quiz</h1>
<p>Let's see how well you know your bestie! 🥹💕</p>
<p id="question">Ready to start?</p>
<div id="options"></div>
<p id="message"></p>
<button id="start" onclick="startQuiz()">Start Quiz 💖</button>
</main>
<script>
const questions=[
{q:"What makes our friendship special? 💗",options:["Trust and care","Only gifts","Nothing"],answer:0},
{q:"What should best friends do? 🫶",options:["Support each other","Ignore each other","Never talk"],answer:0},
{q:"Our friendship deserves... 🎀",options:["Lots of happiness","More arguments","No memories"],answer:0},
{q:"What is important in a friendship? 💕",options:["Honesty","Lies","Ignoring"],answer:0},
{q:"Best friends make the best... 🧸",options:["Memories","Excuses","Arguments"],answer:0}
];
let current=0,score=0,locked=false;
function startQuiz(){
current=0;score=0;locked=false;
document.getElementById("start").style.display="none";
document.getElementById("message").textContent="";
showQuestion();
}
function showQuestion(){
if(current>=questions.length){
document.getElementById("question").textContent="Quiz completed! 🎉";
document.getElementById("options").innerHTML="";
document.getElementById("message").textContent="Your score: "+score+"/"+questions.length+" 💗";
document.getElementById("start").textContent="Play Again 💕";
document.getElementById("start").style.display="inline-block";
return;
}
locked=false;
const item=questions[current];
document.getElementById("question").textContent=(current+1)+". "+item.q;
document.getElementById("message").textContent="";
const options=document.getElementById("options");
options.innerHTML="";
item.options.forEach((option,index)=>{
const btn=document.createElement("button");
btn.textContent=option;
btn.onclick=()=>{
if(locked)return;
locked=true;
if(index===item.answer){
score++;
document.getElementById("message").textContent="Correct! 💖";
}else{
document.getElementById("message").textContent="Nice try, bestie! 💕";
}
setTimeout(()=>{current++;showQuestion()},700);
};
options.appendChild(btn);
});
}
</script>
</body>
</html>
